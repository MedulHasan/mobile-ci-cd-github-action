name: First Build
on: [push]

permissions:
  contents: write

jobs:
  Build-Android-apk:
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.output-name.outputs.apk-file }}
    steps:
      - name: Get code
        uses: actions/checkout@v5

      - name: Install Dependency
        run: yarn install --frozen-lockfile

      - name: Code Lint
        run: yarn lint

      - name: Build APK
        run: cd android && ./gradlew assembleRelease && cd ..

      - name: check file path
        run: ls -R

      - name: Publish apk file name as output
        id: output-name
        run: find android/app/build/outputs/apk/release/app-release.apk -type f -execdir echo 'apk-file{}' >> $GITHUB_OUTPUT ';'

      - name: Complete BUild
        run: echo "Build completed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
  deploy:
    needs: Build-Android-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: app-release-apk
          path: ./apk
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Android Release ${{ github.ref_name }}'
          body: |
            🎉 New Android release build
            Built automatically from commit: ${{ github.sha }}
          files: ./apk/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: echo "Deploying..."
