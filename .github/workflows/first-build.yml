name: First Build
on: [push]
jobs:
  Build-Android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v5

      - name: Install Dependency
        run: yarn install --frozen-lockfile

      - name: Code Lint
        run: yarn lint

      - name: Build APK
        run: cd android && ./gradlew assembleRelease && cd ..

      - name: Complete BUild
        run: echo "Build completed"

      - name: Move APK to custom folder
        run: |
          mkdir -p apk/android/release
          cp android/app/build/outputs/apk/release/app-release.apk apk/android/release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upload apk artiface
          path: apk/android/release/app-release.apk
  deploy:
    needs: Build-Android-apk
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploying..."
