name: Controlling workflow and job execution

on: [push]

jobs:
    job1:   
        runs-on: ubuntu-latest
        steps:
            - name: step 1
              run: echo "step 1"
    jobA:
      runs-on: ubuntu-latest
      steps: 
        - name: step A
          run: echo "Step A"

        - name: step B
          id: step-b
          run: |
            test 1 -eq 1

        - name: step C
          if: failure() && steps.step-b.outcome == 'failure'
          run: echo "Step C" 
    jobB:
      needs: [jobA]
      runs-on: ubuntu-latest
      steps:
        - name: step B
          run: echo 'step B'
    jobC:
      needs: [jobB]
      runs-on: ubuntu-latest
      steps:
        - name: step C
          run: echo 'step C'
    deploy:
      needs: [jobC]
      uses: ./.guthub/workflows/reusable.yml
    report:
      needs: [job1, jobC]
      if: failure()
      runs-on: ubuntu-latest
      steps:
        - name: step 1D
          run: echo 'step 1D'