name: Check variables

on: [push]

env:
  DAY_OF_WEEK: Monday

jobs:
  Variable-Check:
    runs-on: ubuntu-latest

    env:
      Greeting: Hello
      SUPER_SECRET: ${{ secrets.SUPERSECRET }}

    steps:
      - name: "Say Hello Mona it's Monday"
        run: |
          echo "$Greeting $First_Name. Today is $DAY_OF_WEEK!"
          example-command "$SUPER_SECRET"
